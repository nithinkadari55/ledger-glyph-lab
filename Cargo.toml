[workspace]
members = ["crates/*"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nithinkadari55/ledger-glyph-lab"

[workspace.dependencies]
typst = { path = "vendor/typst/crates/typst" }
typst-kit = { path = "vendor/typst/crates/typst-kit", default-features = false }
typst-layout = { path = "vendor/typst/crates/typst-layout" }
typst-pdf = { path = "vendor/typst/crates/typst-pdf" }
typst-syntax = { path = "vendor/typst/crates/typst-syntax" }
clap = { version = "4.4", features = ["derive", "env"] }
ecow = { version = "0.2.6", features = ["serde"] }
libm = "0.2.11"
miniz_oxide = "0.8.5"
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "warn"
uninlined_format_args = "warn"

[profile.dev.package."*"]
opt-level = 2

# The build script compresses the bundled fonts; keep it fast.
[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
