name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt
      - name: Format
        run: |
          cargo fmt --all
          (cd vendor/typst && cargo fmt --all)
          git diff > fmt.patch
          git diff --stat
          git diff --quiet
      - name: Upload format patch
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fmt.patch
          path: fmt.patch
          retention-days: 7

  test:
    name: Clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Corpus report
        run: |
          cargo build --locked -q -p lgl
          mkdir -p target/geom
          for f in corpus/*.typ; do
            echo "== $f"
            name=$(basename "$f" .typ)
            ./target/debug/lgl check "$f" --geometry "target/geom/$name.json" || echo "exit=$?"
          done
      - name: Upload corpus geometry
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: corpus-geometry
          path: target/geom
          retention-days: 7

  typst-suite:
    name: Typst test suite (vendored)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/typst
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: vendor/typst
      - run: cargo test --locked --workspace --no-run
      - run: cargo test --locked --workspace --no-fail-fast
